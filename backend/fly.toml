app = "security-posture-demo"
primary_region = "iad"

# Single-region deployment to minimize costs
[deploy]
  strategy = "rolling"
  release_command = "poetry run alembic upgrade head"
  release_command_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

# V2 Machines HTTP service configuration
[http_service]
  internal_port = 8000
  force_https = true
  # Machines stop when idle (no active connections)
  auto_stop_machines = "stop"
  # Do NOT auto-start machines on incoming requests -
  # if you shut the machine down, it stays down
  auto_start_machines = false
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[env]
  PORT = "8000"
  REPORTS_DIR = "/data/reports"
  FLY_PRIMARY_REGION = "iad"

[[mounts]]
  source = "reports_data"
  destination = "/data"

# Minimal VM configuration to reduce Fly.io costs
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
